<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 8" opacity="0.4"/>

  <!-- Cheese Wedge in background -->
  <g transform="translate(300, 240) rotate(-15)">
    <polygon points="0,-60 120,40 -40,60" fill="url(#cheeseGrad)" filter="url(#glow)"/>
    <circle cx="30" cy="15" r="10" fill="#d97706" opacity="0.8"/>
    <circle cx="65" cy="-5" r="8" fill="#d97706" opacity="0.8"/>
    <circle cx="10" cy="-25" r="6" fill="#d97706" opacity="0.8"/>
  </g>

  <!-- Mouse Character -->
  <g transform="translate(140, 160)">
    <!-- Tail -->
    <path d="M 0 160 C -80 180 -100 80 -140 100" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Body -->
    <ellipse cx="100" cy="130" rx="95" ry="60" fill="#94a3b8"/>
    
    <!-- Back Leg -->
    <ellipse cx="60" cy="175" rx="20" ry="14" fill="#cbd5e1"/>
    <!-- Front Leg -->
    <ellipse cx="140" cy="175" rx="20" ry="14" fill="#cbd5e1"/>

    <!-- Ears -->
    <circle cx="150" cy="50" r="38" fill="#64748b"/>
    <circle cx="150" cy="50" r="22" fill="#f472b6"/>
    
    <circle cx="100" cy="45" r="32" fill="#475569"/>
    <circle cx="100" cy="45" r="18" fill="#f472b6"/>

    <!-- Head & Nose -->
    <ellipse cx="170" cy="115" rx="45" ry="35" fill="#94a3b8"/>
    <circle cx="215" cy="120" r="12" fill="#f472b6"/>
    
    <!-- Eye with shine -->
    <circle cx="165" cy="98" r="9" fill="#09090b"/>
    <circle cx="163" cy="95" r="3" fill="#ffffff"/>

    <!-- Whiskers -->
    <line x1="205" y1="115" x2="250" y2="105" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <line x1="205" y1="125" x2="250" y2="135" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- Speed Dust effect -->
  <circle cx="60" cy="380" r="10" fill="#f59e0b" opacity="0.5"/>
  <circle cx="110" cy="410" r="14" fill="#f59e0b" opacity="0.7"/>
  <circle cx="170" cy="390" r="8" fill="#f59e0b" opacity="0.4"/>
</svg>
